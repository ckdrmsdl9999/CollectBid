name: collectbid
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: collectbid
      POSTGRES_USER: collectbid
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - collectbid-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collectbid -d collectbid"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  collectbid-data:
