spring.application.name=collectbid
# Authentication is provided by our token service; do not create Boot's default in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/collectbid}
spring.datasource.username=${DB_USERNAME:collectbid}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
collectbid.auth.token-ttl=PT2H
collectbid.auction.scheduler-enabled=true
collectbid.auction.close-delay-ms=5000
